<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PYX Website CMS</title><link rel="stylesheet" href="/cms/cms.css?v=eye-20260824-2"></head><body>
<main class="login-view" id="loginView"><section class="login-card"><img src="/assets/brand/pyx-logo.jpeg" alt="PYX logo"><p class="eyebrow">PYX SECURITY SERVICES</p><h1>Website Content Manager</h1><p>Sign in to manage the public website, news, projects, careers and enquiries.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<span class="password-wrap"><input name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-label="password" aria-label="Show password" aria-pressed="false" title="Show password"><span class="eye-icon" aria-hidden="true"></span></button></span></label><button>Sign In</button><p class="message" id="loginMessage" role="status"></p></form><a href="/">← Return to website</a></section></main>
<div class="app" id="app" hidden><aside class="sidebar"><a class="cms-brand" href="/"><img src="/assets/brand/pyx-logo.jpeg" alt=""><span><b>PYX Website CMS</b><small>Content &amp; publishing</small></span></a><nav id="cmsNav">
  <button data-view="overview" class="active">Overview</button><button data-view="sections">Page Sections</button><button data-view="services">Services</button><button data-view="sectors">Sectors</button><button data-view="posts">News &amp; Blogs</button><button data-view="projects">Projects</button><button data-view="jobs">Careers &amp; Jobs</button><button data-view="leads">Submissions</button><button data-view="media">Media Library</button><button data-view="settings">Website Settings</button><button data-view="audit">Activity Log</button>
  </nav><div class="sidebar-foot"><a href="/" target="_blank">View live website ↗</a><button id="logoutButton">Sign Out</button></div></aside>
  <section class="workspace"><header><button class="menu-button" id="menuButton">☰</button><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1 id="viewTitle">Overview</h1></div><div class="user"><span id="userName"></span><button id="passwordButton">Change password</button></div></header><div class="notice-bar" id="noticeBar" hidden></div><div id="content" class="content"></div></section>
</div>
<dialog id="editorDialog"><form method="dialog" class="dialog-shell"><header><div><p class="eyebrow" id="dialogKicker">EDIT CONTENT</p><h2 id="dialogTitle">Edit item</h2></div><button value="cancel" class="icon-button" aria-label="Close">×</button></header><div id="editorFields" class="editor-fields"></div><footer><button value="cancel" class="secondary">Cancel</button><button type="button" id="saveEditor">Save Changes</button></footer></form></dialog>
<dialog id="passwordDialog"><form class="dialog-shell narrow" id="passwordForm"><header><div><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change password</h2></div></header><div class="editor-fields"><label>Current password<span class="password-wrap"><input name="currentPassword" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-label="current password" aria-label="Show current password" aria-pressed="false" title="Show current password"><span class="eye-icon" aria-hidden="true"></span></button></span></label><label>New password<span class="password-wrap"><input name="newPassword" type="password" autocomplete="new-password" minlength="12" required><button class="password-toggle" type="button" data-password-label="new password" aria-label="Show new password" aria-pressed="false" title="Show new password"><span class="eye-icon" aria-hidden="true"></span></button></span><small>At least 12 characters with uppercase, lowercase and a number.</small></label><label>Confirm new password<span class="password-wrap"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button class="password-toggle" type="button" data-password-label="confirmation password" aria-label="Show confirmation password" aria-pressed="false" title="Show confirmation password"><span class="eye-icon" aria-hidden="true"></span></button></span></label><p class="message" id="passwordMessage"></p></div><footer><button type="button" class="secondary" id="cancelPassword">Cancel</button><button>Update Password</button></footer></form></dialog>
<script src="/cms/cms.js?v=eye-20260824-2"></script></body></html>
